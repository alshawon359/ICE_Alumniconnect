version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: alumniconnect_mysql_local
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: alumniconnect
    ports:
      - "3307:3306"
    volumes:
      - alumniconnect_mysql_local_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  alumniconnect_mysql_local_data:
    driver: local