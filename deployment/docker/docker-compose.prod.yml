version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: alumniconnect_db
    environment:
      MYSQL_ROOT_PASSWORD: local-root-pass-change-in-prod
      MYSQL_DATABASE: alumniconnect
      MYSQL_USER: ac_user
      MYSQL_PASSWORD: local-db-pass-change-in-prod
    ports:
      - "33061:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - alumniconnect

  backend:
    build:
      context: ../../
      dockerfile: deployment/docker/Dockerfile.backend
    container_name: alumniconnect_backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_USER: ac_user
      MYSQL_PASSWORD: local-db-pass-change-in-prod
      MYSQL_DB: alumniconnect
      AUTO_INIT_DB: "true"
      DEBUG: "false"
      SECRET_KEY: local-dev-secret-key-change-in-prod
      PORT: 5000
      PUBLIC_BASE_URL: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      MAIL_PROVIDER: brevo
      BREVO_API_KEY: dummy-key-local-only
      SMTP_FROM_EMAIL: test@local.example.com
      ADMIN_USERNAME: admin@example.com
      ADMIN_PASSWORD: admin@1234
    ports:
      - "5001:5000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - alumniconnect
    restart: on-failure

volumes:
  db_data:
    driver: local

networks:
  alumniconnect:
    driver: bridge
