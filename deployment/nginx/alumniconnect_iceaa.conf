# Alumni Connect - Nginx Configuration (HTTP Only)
# React SPA + Flask API + Gunicorn
# No SSL / HTTPS

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name csf.ru.ac.bd 172.30.240.39 localhost;

    # -----------------------------
    # Performance
    # -----------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # -----------------------------
    # Upload Limit
    # -----------------------------
    client_max_body_size 100M;

    # Root Redirect
    # Redirect csf.ru.ac.bd -> /iceaa/
    # Serve /iceaa directly (as /iceaa/)
    # Redirect SPA routes to /iceaa/ if accessed from root
    # -----------------------------
    location = / {
        return 301 /iceaa/;
    }

    # Redirect /iceaa to /iceaa/ (trailing slash required for SPA)
    location = /iceaa {
        return 301 /iceaa/;
    }

    # SPA Routes - redirect to /iceaa/ if accessed from root
    # Catches: /admin, /admin-dashboard, /student-dashboard, /alumni-dashboard, /alumni-login, etc.
    location ~ ^/(admin|admin-dashboard|student-dashboard|alumni-dashboard|admin-login|student-login|alumni-login|alumni-forgot-password|student-forgot-password|alumni-register|student-register|edit-profile|profile|success-story|success-stories)(?:/.*)?$ {
        return 301 /iceaa$request_uri;
    }

    # -----------------------------
    # Flask API Reverse Proxy
    # Gunicorn running on 127.0.0.1:5000
    # -----------------------------
    location /iceaa/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # -----------------------------
    # Uploads (Images, Documents)
    # -----------------------------
    location /iceaa/uploads/ {
        proxy_pass http://127.0.0.1:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;

        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

        expires 30d;
        add_header Cache-Control "public, immutable";

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }


    # Cache busting for index.html
    location = /iceaa/index.html {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Static assets - HIGHEST PRIORITY (using ^~ to prevent regex matching)
    # This ensures it takes priority over the general /iceaa/ location
    location ^~ /iceaa/assets/ {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/assets/;
        
        # Use try_files with a named location to prevent redirects
        try_files $uri $uri/ @asset_not_found;
        
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
        autoindex off;
    }
    
    # Return 404 for missing assets without any redirect
    location @asset_not_found {
        return 404;
    }

    # React SPA - ALL /iceaa/ ROUTES
    # Fallback for client-side routing: serve index.html for any non-existent paths
    location /iceaa/ {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/;
        
        # Try to serve the requested file
        # If file not found, serve index.html for SPA routing
        try_files $uri /iceaa/index.html;
        
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -----------------------------
    # Security Rules
    # -----------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git) {
        deny all;
    }

    # -----------------------------
    # Logs
    # -----------------------------
    access_log /var/log/nginx/iceaa_access.log;
    error_log  /var/log/nginx/iceaa_error.log;
}