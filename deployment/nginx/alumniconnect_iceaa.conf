# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name csf.ru.ac.bd;

    # Send the bare site root directly to the subpath.
    location = / {
        return 301 https://$host/iceaa/;
    }

    # Redirect all other HTTP traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Production Alumni Connect
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csf.ru.ac.bd;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/csf.ru.ac.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csf.ru.ac.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_level 6;

    # Upload body size limit (100MB for file uploads)
    client_max_body_size 100M;

    root /var/www/alumniconnect/frontend/dist;
    index index.html;

    # Root redirects to /iceaa/
    location = /iceaa {
        return 301 /iceaa/;
    }

    location = / {
        return 301 /iceaa/;
    }

    location = /index.html {
        return 301 /iceaa/;
    }

    # Proxy API requests to Gunicorn backend (127.0.0.1:5000)
    location ^~ /iceaa/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Healthcheck endpoint
    location = /iceaa/api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
        access_log off;
    }

    # Serve the single-page app on the /iceaa subpath with SPA routing
    location ^~ /iceaa/ {
        rewrite ^/iceaa/(.*?)$ /$1 break;
        try_files $uri $uri/ /index.html;
    }

    # Static assets with aggressive caching
    location ~* ^/iceaa/assets/.*\.(?:js|css|png|jpg|jpeg|svg|gif|ico|webp|woff|woff2|ttf|eot)$ {
        rewrite ^/iceaa/(.*?)$ /$1 break;
        try_files $uri =404;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Security: Deny access to sensitive files
    location ~ /\.env { deny all; }
    location ~ /\.git { deny all; }
    location ~ /config\.php { deny all; }
}
