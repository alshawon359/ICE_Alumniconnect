server {
    listen 80;
    server_name csf.ru.ac.bd;

    # Send the bare site root directly to the subpath.
    location = / {
        return 301 https://$host/iceaa/;
    }

    # Redirect all other HTTP traffic to HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name csf.ru.ac.bd;

    ssl_certificate /etc/letsencrypt/live/csf.ru.ac.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csf.ru.ac.bd/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/alumniconnect/frontend;
    index index.html;

    location = /iceaa {
        return 301 /iceaa/;
    }

    location = / {
        return 301 /iceaa/;
    }

    location = /index.html {
        return 301 /iceaa/;
    }

    # Proxy API requests to Gunicorn backend
    location ^~ /iceaa/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }

    # Healthcheck endpoint proxy
    location = /iceaa/api/health {
        proxy_pass http://127.0.0.1:5000/api/health;
    }

    # Serve the single-page app on the /iceaa subpath
    location ^~ /iceaa/ {
        try_files $uri $uri/ /iceaa/index.html;
    }

    # Static assets (optional explicit cache headers)
    location ~* \.(?:js|css|png|jpg|jpeg|svg|gif|ico|webp)$ {
        try_files $uri =404;
        access_log off;
        expires 30d;
    }

    # Deny access to env files
    location ~ /\.env { deny all; }
}
