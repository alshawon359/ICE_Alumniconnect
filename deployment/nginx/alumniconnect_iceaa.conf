# Alumni Connect - Nginx Configuration (HTTP Only)
# React SPA + Flask API + Gunicorn
# No SSL / HTTPS

server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name csf.ru.ac.bd 172.30.240.39 localhost;

    # -----------------------------
    # Performance
    # -----------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;

    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml;

    # -----------------------------
    # Upload Limit
    # -----------------------------
    client_max_body_size 100M;

    # -----------------------------
    # Root Redirect
    # Redirect csf.ru.ac.bd -> /iceaa/
    # -----------------------------
    location = / {
        return 301 /iceaa/;
    }

    # -----------------------------
    # Flask API Reverse Proxy
    # Gunicorn running on 127.0.0.1:5000
    # -----------------------------
    location /iceaa/api/ {

        proxy_pass http://127.0.0.1:5000/api/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # -----------------------------
    # Uploads (Images, Documents)
    # Proxy to Flask backend for serving uploaded files
    # CRITICAL: Images must load here for /iceaa/ deployment
    # -----------------------------
    location /iceaa/uploads/ {

        proxy_pass http://127.0.0.1:5000/uploads/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # IMPORTANT: CORS headers for images and files
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type' always;
        add_header 'Cross-Origin-Resource-Policy' 'cross-origin' always;

        # Cache uploaded files (they don't change)
        expires 30d;
        add_header Cache-Control "public, immutable";

        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    # Static Assets
    # React build assets
    # --------- -----
    location /iceaa/assets/ {

        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/assets/;

        access_log off;

        expires 30d;

        add_header Cache-Control "public, immutable";
    }

    # -----------------------------
    # React SPA
    # Handles React Router paths
    # -----------------------------
    location /iceaa/ {

        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/;

        index index.html;

        # With alias, fallback path is relative to alias root, NOT location prefix
        try_files $uri $uri/ /index.html;

        expires -1;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # -----------------------------
    # Security Rules
    # -----------------------------
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(env|git) {
        deny all;
    }

    # -----------------------------
    # Logs
    # -----------------------------
    access_log /var/log/nginx/iceaa_access.log;
    error_log  /var/log/nginx/iceaa_error.log;
}