# =========================
# HTTP SERVER - Redirect all to HTTPS
# =========================
server {
    listen 80;
    listen [::]:80;
    server_name csf.ru.ac.bd;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# =========================
# HTTPS SERVER - Production
# =========================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csf.ru.ac.bd;

    # SSL Configuration
    ssl_certificate /etc/letsencrypt/live/csf.ru.ac.bd/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/csf.ru.ac.bd/privkey.pem;

    # SSL Security
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 100M;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # =========================
    # ROOT REDIRECT (Keep it simple)
    # =========================
    location = / {
        return 301 https://$host/iceaa/;
    }

    # =========================
    # API PROXY
    # =========================
    location /iceaa/api/ {
        proxy_pass http://127.0.0.1:5000/api/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect off;
    }

    # =========================
    # STATIC ASSETS (React build)
    # =========================
    location ^~ /iceaa/assets/ {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # =========================
    # SPA MAIN APP
    # =========================
    location /iceaa/ {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/;
        
        # SPA routing fix: Sub-directory index fallback
        try_files $uri $uri/ index.html;

        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # =========================
    # SECURITY BLOCKS
    # =========================
    location ~ /\. {
        deny all;
    }
}