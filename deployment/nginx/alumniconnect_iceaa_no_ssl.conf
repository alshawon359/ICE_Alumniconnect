# Alumni Connect - Nginx Configuration (Without SSL/TLS)
# For use when SSL/TLS is not configured or auto-managed by reverse proxy
# Supports both HTTP (port 80) and HTTPS (port 443) with self-signed certs

# HTTP Server - Redirect to HTTPS if available
server {
    listen 80;
    listen [::]:80;
    server_name csf.ru.ac.bd;

    # Send the bare site root directly to the subpath.
    location = / {
        return 301 https://$host/iceaa/;
    }

    # Redirect all other HTTP traffic to HTTPS (optional).
    # Comment out if you want HTTP to work without redirect
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server - Optional (with self-signed cert if needed)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name csf.ru.ac.bd;

    # SSL Configuration - Generate self-signed cert if needed:
    # sudo openssl req -x509 -newkey rsa:4096 -nodes -out /etc/nginx/certs/self-signed.crt -keyout /etc/nginx/certs/self-signed.key -days 365
    ssl_certificate /etc/nginx/certs/self-signed.crt;
    ssl_certificate_key /etc/nginx/certs/self-signed.key;
    
    ssl_session_cache shared:SSL:50m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
    gzip_comp_level 6;

    # Upload body size limit (100MB for file uploads)
    client_max_body_size 100M;

    # Root redirects to /iceaa/
    location = / {
        return 301 /iceaa/;
    }

    # Proxy API requests to Gunicorn backend (127.0.0.1:5000)
    location /iceaa/api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $server_name;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static assets - exact file extension matching
    location ~* ^/iceaa/assets/.*\.(js|css|png|jpg|jpeg|svg|gif|ico|webp|woff|woff2|ttf|eot)$ {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/assets/;
        access_log off;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Main SPA location - serves React app with proper routing
    location /iceaa/ {
        alias /var/www/html/iceaa/ICE_AlumniConnect/react-app/dist/;
        
        # SPA routing: serve index.html for any path that isn't a real file/directory
        # This allows React Router to handle all routing client-side
        try_files $uri $uri/ /index.html;
        
        # No caching for HTML
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Security: Deny access to sensitive files
    location ~ /\.env { deny all; }
    location ~ /\.git { deny all; }
    location ~ /config\.php { deny all; }
}
